<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tajzia: Document and Financial Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef2f8;--sheet:#ffffff;--ink:#101c33;--muted:#54627a;--line:#cdd7e6;--grid:#dde5f0;
  --cobalt:#2740d8;--cobalt-ink:#ffffff;--hl:#ffe14d;--hl-ink:#101c33;
  --good:#0f7a52;--good-bg:#dcf3e8;--warn:#8a5a00;--warn-bg:#fdf0c4;--bad:#c22a41;--bad-bg:#fbe0e4;
  --f-good:#12a06b;--f-warn:#f0b400;--f-bad:#e0364f;
  --k1:#2740d8;--k2:#0d9aa8;--k3:#e0a800;--k4:#8a4fd0;--k5:#c22a41;--k6:#0f9d6b;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0a1120;--sheet:#111b2e;--ink:#e6ecf8;--muted:#95a5c2;--line:#26344f;--grid:#131e33;
    --cobalt:#8ea4ff;--cobalt-ink:#0a1120;--hl:#ffe14d;--hl-ink:#101c33;
    --good:#4ed3a0;--good-bg:#0f3327;--warn:#f0c15c;--warn-bg:#3a2d0b;--bad:#ff8a9a;--bad-bg:#43161f;
    --f-good:#2fc58d;--f-warn:#f0c040;--f-bad:#ff6b80;
    --k1:#8ea4ff;--k2:#3ec8d6;--k3:#f0c040;--k4:#b58aec;--k5:#ff6b80;--k6:#2fc58d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a1120;--sheet:#111b2e;--ink:#e6ecf8;--muted:#95a5c2;--line:#26344f;--grid:#131e33;
  --cobalt:#8ea4ff;--cobalt-ink:#0a1120;--hl:#ffe14d;--hl-ink:#101c33;
  --good:#4ed3a0;--good-bg:#0f3327;--warn:#f0c15c;--warn-bg:#3a2d0b;--bad:#ff8a9a;--bad-bg:#43161f;
  --f-good:#2fc58d;--f-warn:#f0c040;--f-bad:#ff6b80;
  --k1:#8ea4ff;--k2:#3ec8d6;--k3:#f0c040;--k4:#b58aec;--k5:#ff6b80;--k6:#2fc58d;
  color-scheme:dark;
}
html[lang="ur"]{--f-body:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;--f-display:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif}
html[lang="sd"]{--f-body:'Noto Naskh Arabic','Noto Nastaliq Urdu',serif;--f-display:'Noto Naskh Arabic','Noto Nastaliq Urdu',serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{
  margin:0;background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:400 16px/1.6 var(--f-body);
}
html[lang="ur"] body{line-height:2.1}
html[lang="sd"] body{line-height:1.85}
[dir="rtl"] *{letter-spacing:0!important}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.2}
.navlinks{display:flex;gap:8px;margin-inline-end:auto}
.about-link{font:600 14px/1.5 var(--f-body);color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 16px}
.about-link:hover{border-color:var(--ink)}
.brand svg{width:32px;height:32px;flex:none}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);font:600 14px/1.5 var(--f-body);padding:5px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sel select{font:500 14px/1.5 var(--f-body);color:var(--ink);background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:5px 8px;max-width:190px}

/* hero + doors */
.hero{padding:34px 0 20px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,48px);line-height:1.1;letter-spacing:-.025em;max-width:22ch;margin:0 0 14px}
html[lang="ur"] .hero h1{line-height:1.75;font-weight:600;max-width:24ch}
html[lang="sd"] .hero h1{line-height:1.5;max-width:24ch}
.hero p{max-width:62ch;color:var(--muted);margin:0}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 22px}
.door{text-align:start;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px}
.door b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.door span{color:var(--muted);font-size:14px;line-height:1.4}
.door[aria-selected="true"]{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:0 5px 0 var(--hl)}

/* sheets and forms */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.4vw,26px);margin-bottom:16px}
.sheet h2{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;line-height:1.3}
.sheet h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0 0 10px;line-height:1.3}
.sheet h4{font-family:var(--f-display);font-size:16px;font-weight:700;margin:18px 0 2px;color:var(--cobalt)}
.lbl{font-weight:600;font-size:14px;margin:0 0 8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{font:500 14px/1.5 var(--f-body);border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.chips button[aria-checked="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--ink);font-weight:600}
textarea,input[type="text"],input[type="number"]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:250px;resize:vertical;line-height:1.6}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}
.hint{color:var(--muted);font-size:14px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.btn{font:600 15px/1.5 var(--f-body);padding:9px 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt);box-shadow:0 3px 0 var(--ink)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{border-color:var(--line);font-weight:500}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file:focus-within{outline:3px solid var(--cobalt);outline-offset:2px}
.msg{min-height:1.6em;margin:6px 0 0;color:var(--bad);font-size:14px}
.msg.info{color:var(--muted)}

/* gauge */
.rtop{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center}
.gauge{direction:ltr}
.gnum{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:clamp(60px,10vw,92px);line-height:1;letter-spacing:-.04em}
.gnum small{font-size:.3em;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:6px}
.ruler{position:relative;height:22px;margin-top:14px;border-radius:4px;background:var(--grid);border:1px solid var(--line)}
.ruler .fill{position:absolute;top:0;bottom:0;left:0;width:var(--v);border-radius:3px 0 0 3px}
.ruler::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(10,17,32,.32) calc(10% - 1px),rgba(10,17,32,.32) 10%);pointer-events:none}
.ruler .mark{position:absolute;left:var(--v);top:-9px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink);transform:translateX(-50%);z-index:2}
.gticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.fill.good{background:var(--f-good)}.fill.warn{background:var(--f-warn)}.fill.bad{background:var(--f-bad)}
.grade{margin-top:10px;font-family:var(--f-display);font-size:22px;font-weight:700}
.grade span{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);margin-inline-start:8px}
.cat{margin-bottom:14px}
.cat-h{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:4px}
.bar{position:relative;height:10px;background:var(--grid);border:1px solid var(--line);border-radius:3px;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(10,17,32,.3) calc(10% - 1px),rgba(10,17,32,.3) 10%)}
.bar i.good{background:var(--f-good)}.bar i.warn{background:var(--f-warn)}.bar i.bad{background:var(--f-bad)}
.fixfirst{background:var(--warn-bg);border-radius:8px;padding:12px 16px;margin-top:20px}
.fixfirst h3{margin-bottom:6px;font-size:16px}
.fixfirst ul{margin:0;padding-inline-start:20px}
.fixfirst li{margin:4px 0;font-size:15px}

/* stats, checks, chips */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.stat{background:var(--sheet);padding:10px 14px;display:flex;flex-direction:column}
.stat span{font-size:13px;color:var(--muted);line-height:1.4}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.3}
.checks{list-style:none;margin:0;padding:0}
.ck{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.ck:first-child{border-top:0}
.ck .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--f-body);margin-top:3px}
.ck.pass .ic{background:var(--good-bg);color:var(--good)}
.ck.warn .ic{background:var(--warn-bg);color:var(--warn)}
.ck.fail .ic{background:var(--bad-bg);color:var(--bad)}
.ck-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ck-t b{font-weight:600}
.val{color:var(--muted);font-size:13px}
.ck p{margin:2px 0 0;color:var(--muted);font-size:15px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px}
.kw span b{margin-inline-start:6px;color:var(--cobalt)}
details.sheet summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:18px}
details.sheet[open] summary{margin-bottom:10px}
.flag li{margin:8px 0;font-size:15px}
.flag mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
.note{color:var(--muted);font-size:14px;margin:6px 0}

/* finance */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.pill{background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:2px 14px;font-weight:600;font-size:14px}
details.rates{margin:0 0 16px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
details.rates summary{cursor:pointer;font-weight:600}
.rate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}
.rate{display:flex;align-items:center;gap:8px;font-size:14px}
.rate input{width:100px;padding:5px 8px}
.stm{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.tbl{overflow-x:auto;max-width:100%}
.ledger{width:100%;border-collapse:collapse;min-width:430px}
.ledger th,.ledger td{padding:4px 6px;font-size:14px;line-height:1.5}
.ledger thead th{font-weight:600;text-align:end;color:var(--muted);border-bottom:1.5px solid var(--ink);white-space:nowrap}
.ledger thead th:first-child{text-align:start}
.ledger tbody th{font-weight:400;text-align:start}
.ledger td{text-align:end}
.ledger tr.head th{font-family:var(--f-display);font-weight:700;font-size:15px;padding-top:14px;text-align:start}
.ledger tr.r-calc th,.ledger tr.r-calc td{font-weight:700;border-top:1px solid var(--ink)}
.ledger tr.r-memo th,.ledger tr.r-memo td{font-style:italic;color:var(--muted)}
.ledger tr.r-final th,.ledger tr.r-final td{border-bottom:3px double var(--ink)}
.ledger tr.r-diff th,.ledger tr.r-diff td{font-weight:500;color:var(--muted);border-top:1px dashed var(--line)}
.ledger tr.r-diff.bad th,.ledger tr.r-diff.bad td{color:var(--bad);font-weight:700}
.amt{width:100%;min-width:100px;text-align:end;direction:ltr;font:inherit;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.bal{margin-top:10px;font-weight:600;font-size:14px}
.bal.ok{color:var(--good)}.bal.bad{color:var(--bad)}
.rgroup{margin-top:22px}
.rgroup h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.rcard{background:var(--sheet);border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:8px;padding:8px 12px}
.rcard.good{border-inline-start-color:var(--f-good)}.rcard.fair{border-inline-start-color:var(--f-warn)}.rcard.weak{border-inline-start-color:var(--f-bad)}
.rname{font-size:14px;color:var(--muted);line-height:1.4}
.rval{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font:600 12px/1.6 var(--f-body);border-radius:999px;padding:0 10px;display:inline-flex;gap:4px;align-items:center}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.fair{background:var(--warn-bg);color:var(--warn)}.badge.weak{background:var(--bad-bg);color:var(--bad)}
.rmeta{font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;flex-wrap:wrap;gap:0 14px}
.dupont{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
.dupont>div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;flex-direction:column}
.dupont>div small{font:400 12.5px/1.4 var(--f-body);color:var(--muted)}
.dupont>div.eq{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.dupont>div.eq small{color:var(--hl-ink)}
.dupont>span{font-size:22px;color:var(--muted)}
.cbar{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1.5px solid var(--ink);direction:ltr}
.cbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:12px;height:12px;border-radius:3px;display:inline-block}
.k-cogs{background:var(--k1)}.k-opex{background:var(--k2)}.k-da{background:var(--k3)}.k-int{background:var(--k4)}.k-tax{background:var(--k5)}.k-ni{background:var(--k6)}
.ins{list-style:none;margin:0;padding:0}
.ins li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.ins li:first-child{border-top:0}
.ins .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--f-body);margin-top:3px}
.ins .good .ic{background:var(--good-bg);color:var(--good)}
.ins .risk .ic{background:var(--bad-bg);color:var(--bad)}
.ins .info .ic{background:var(--warn-bg);color:var(--warn)}
.hv{width:100%;border-collapse:collapse;min-width:520px;margin-bottom:14px}
.hv th,.hv td{padding:4px 8px;font-size:14px;border-bottom:1px solid var(--line)}
.hv thead th{color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--ink);text-align:end;white-space:nowrap}
.hv thead th:first-child,.hv tbody th{text-align:start}
.hv tbody th{font-weight:400}
.hv td{text-align:end}
.empty{color:var(--muted)}
.foot{color:var(--muted);font-size:14px;padding:12px 0 36px;max-width:80ch}

@media (max-width:820px){
  .rtop,.stm,.grid2{grid-template-columns:1fr}
  .rtop{gap:22px}
}
@media (max-width:520px){
  .doors{grid-template-columns:1fr}
  .brand{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="17" width="4" height="8" fill="currentColor"/><rect x="14" y="11" width="4" height="14" fill="currentColor"/><rect x="21" y="6" width="4" height="19" fill="#2740d8"/></svg>
      <span data-i18n="app_name"></span>
    </div>
    <div class="navlinks">
      <a href="pages/about.html" class="about-link" id="aboutLink">About</a>
      <a href="pages/terms.html" class="about-link" id="termsLink">Terms</a>
    </div>
    <div class="ctrls">
      <div class="lang" id="langSeg" role="group" aria-label="Language"></div>
      <label class="sel"><span data-i18n="cur"></span><select id="curSel"></select></label>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="tagline"></h1>
    <p data-i18n="badge"></p>
  </section>

  <div class="doors" role="tablist">
    <button class="door" role="tab" id="tab-docs" aria-selected="true" aria-controls="panel-docs" data-tab="docs"><b data-i18n="tab_docs"></b><span data-i18n="tab_docs_d"></span></button>
    <button class="door" role="tab" id="tab-fin" aria-selected="false" aria-controls="panel-fin" data-tab="fin"><b data-i18n="tab_fin"></b><span data-i18n="tab_fin_d"></span></button>
  </div>

  <section id="panel-docs" role="tabpanel" aria-labelledby="tab-docs">
    <div class="sheet">
      <span class="lbl" data-i18n="doc_type"></span>
      <div class="chips" id="typeSeg" role="radiogroup"></div>
      <label class="lbl" for="docText" data-i18n="doc_input"></label>
      <textarea id="docText" data-i18n-ph="doc_ph" spellcheck="false"></textarea>
      <div class="row">
        <label class="btn ghost file"><input type="file" id="fileIn" accept=".txt,.md,.docx"><span data-i18n="doc_upload"></span></label>
        <span class="hint" data-i18n="doc_pdf"></span>
      </div>
      <div class="grid2">
        <label class="field" id="fTarget"><span data-i18n="doc_target"></span><input type="number" id="targetWords" min="0" inputmode="numeric"></label>

asg:`The Impact of Social Media on University Students' Academic Performance

Introduction
Social media has become part of daily life for most university students. This essay examines how platforms such as Instagram, YouTube and WhatsApp affect students' study habits and grades. It argues that the effect depends more on how students use these platforms than on how long they use them.

Body
Previous research offers mixed evidence. Rahman (2019) found that time spent on video platforms was negatively related to overall grade point average, while Ali and Baig (2021) reported similar results among heavy users. However, Khan et al. (2022) showed that educational use of social media can improve collaboration and motivation. For example, many students form WhatsApp groups to share lecture notes and clarify deadlines.

Another important factor is distraction. Notifications interrupt concentration, and it has been shown that a student needs several minutes to regain focus after each interruption. Therefore, students who study with their phones nearby often take longer to finish the same task. Moreover, sleep is affected because late-night scrolling reduces rest before exams.

On the other hand, social media is really a very useful tool for finding free learning resources. Students can watch tutorials, join academic communities and follow experts. In addition, universities use these platforms to share announcements quickly.

Conclusion
In conclusion, social media is neither entirely harmful nor entirely helpful. Students who plan their usage, silence notifications during study time and use platforms for learning are likely to benefit. Universities should teach digital study skills to help students find this balance.

References
Ali, S., & Baig, M. (2021). Screen time and grades in Pakistani universities. Journal of Sample Studies, 9(2), 22-35.
Khan, A., et al. (2022). Educational uses of messaging apps. Journal of Sample Studies, 11(1), 5-19.
Rahman, T. (2019). Video platforms and student performance. Journal of Sample Studies, 7(3), 40-58.`,
rep:`Mobile Payment Adoption Among Small Retailers in Karachi

Abstract
This study investigates the factors that influence the adoption of mobile payment services among small retailers in Karachi. A survey of 120 shop owners was analyzed using multiple regression. Perceived usefulness and trust were significant predictors of adoption, while age was not.

Introduction
Small retailers form a large share of Pakistan's economy, yet many still rely on cash. The purpose of this study is to examine why some retailers adopt mobile payments while others do not. The research questions are: (RQ1) Does perceived usefulness affect adoption? (RQ2) Does trust affect adoption?

Literature Review
The technology acceptance model explains adoption through perceived usefulness and ease of use (Davis, 1989). Later studies extended it with trust in financial services (Ahmed & Shah, 2020; Malik et al., 2021). However, few studies focus on small retailers in Pakistani cities.

Methodology
A quantitative survey design was used. The sample consisted of 120 retailers selected through convenience sampling. Data were collected with a questionnaire using a five-point Likert scale, and reliability was checked with Cronbach's alpha (0.84). Participants gave informed consent.

Results
Regression results show that perceived usefulness (β = 0.42, p < 0.01) and trust (β = 0.31, p < 0.05) significantly predicted adoption, while age was not significant (p = 0.27). The model explained 38% of the variance (R² = 0.38). See Table 1 for details.

Discussion
The results support earlier work (Ahmed & Shah, 2020). Retailers who trust the provider are more willing to use the service. The findings imply that providers should reduce hidden fees.

Conclusion
Mobile payment adoption among small retailers is driven mainly by usefulness and trust. A limitation of this study is its small, non-random sample. Future research should include other cities.

References
Ahmed, S., & Shah, R. (2020). Trust and digital payments in emerging markets. Journal of Sample Studies, 12(2), 45-60.
Davis, F. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319-340.
Malik, T., et al. (2021). Mobile wallets and small business growth. Journal of Sample Studies, 14(1), 10-25.`

function detect(lines,defs){
  const marks=[];
  lines.forEach((l,idx)=>{
    const s=l.trim();if(!s)return;
    let head=null,inline='';
    const cm=s.match(/^[#*_\s]*([A-Za-z][A-Za-z &\/]{2,40}?)\s*[:\-–—]\s+(\S.*)$/);
    if(cm){const n=normHead(cm[1]);for(const id in defs){if(defs[id].test(n)){head=id;inline=cm[2];break;}}}
    if(!head){const n=normHead(s);if(n&&n.length<=70)for(const id in defs){if(defs[id].test(n)){head=id;break;}}}
    if(head)marks.push({id:head,idx,inline});
  });
  const out={};
  marks.forEach((m,i)=>{
    const end=i+1<marks.length?marks[i+1].idx:lines.length;
    if(!out[m.id])out[m.id]={idx:m.idx,text:((m.inline?m.inline+'\n':'')+lines.slice(m.idx+1,end).join('\n')).trim()};
  });
  return out;
}

function parseNum(s){
  s=String(s).trim();if(!s)return null;
  s=s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٬،,\s]/g,'').replace(/٫/g,'.');
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  const v=Number(s);if(!isFinite(v)||s==='')return null;
  return neg?-v:v;
}
const rate=()=>state.rates[state.cur];
const fmtInp=v=>new Intl.NumberFormat(CURS[state.cur].loc,{maximumFractionDigits:2}).format(Math.round(v*100)/100);

function getStm(p){
  const v=id=>Number(state.fin[p][id])||0;
  const IS={rev:v('rev'),cogs:v('cogs'),opex:v('opex'),da:v('da'),int:v('int'),oth:v('oth'),tax:v('tax')};
  IS.gp=IS.rev-IS.cogs;IS.ebit=IS.gp-IS.opex-IS.da;IS.ebitda=IS.ebit+IS.da;IS.ebt=IS.ebit-IS.int+IS.oth;IS.ni=IS.ebt-IS.tax;
  const B={cash:v('cash'),ar:v('ar'),inv:v('inv'),oca:v('oca'),ppe:v('ppe'),ona:v('ona'),ap:v('ap'),std:v('std'),ocl:v('ocl'),ltd:v('ltd'),oncl:v('oncl'),eq:v('eq')};
  B.tca=B.cash+B.ar+B.inv+B.oca;B.ta=B.tca+B.ppe+B.ona;B.tcl=B.ap+B.std+B.ocl;B.tl=B.tcl+B.ltd+B.oncl;B.tle=B.tl+B.eq;B.diff=B.ta-B.tle;
  return{IS,B,has:Object.values(state.fin[p]).some(x=>x!=null&&x!==0)};
}
const unbalanced=S=>{const m=Math.max(Math.abs(S.B.ta),Math.abs(S.B.tle));return Math.abs(S.B.diff)>Math.max(1e-9,m*0.005);};
const div=(a,b)=>(b===0||!isFinite(a/b))?null:a/b;
function ratios(S,P){
  const i=S.IS,b=S.B,debt=b.std+b.ltd,r={};
  r.current=div(b.tca,b.tcl);r.quick=div(b.cash+b.ar,b.tcl);r.cash=div(b.cash,b.tcl);r.wc=b.tca-b.tcl;
  r.gm=div(i.gp,i.rev);r.om=div(i.ebit,i.rev);r.ebitdam=div(i.ebitda,i.rev);r.nm=div(i.ni,i.rev);r.roa=div(i.ni,b.ta);r.roe=b.eq>0?div(i.ni,b.eq):null;
  r.de=b.eq>0?div(debt,b.eq):null;r.dr=div(b.tl,b.ta);r.em=b.eq>0?div(b.ta,b.eq):null;r.icr=i.int>0?div(i.ebit,i.int):null;
  r.at=div(i.rev,b.ta);r.invt=b.inv>0?div(i.cogs,b.inv):null;
  r.dio=i.cogs>0?365*b.inv/i.cogs:null;r.dso=i.rev>0?365*b.ar/i.rev:null;r.dpo=i.cogs>0?365*b.ap/i.cogs:null;
  r.ccc=(r.dio!=null&&r.dso!=null&&r.dpo!=null)?r.dio+r.dso-r.dpo:null;
  r.revg=P&&P.IS.rev!==0?(i.rev-P.IS.rev)/Math.abs(P.IS.rev):null;
  r.nig=P&&P.IS.ni!==0?(i.ni-P.IS.ni)/Math.abs(P.IS.ni):null;
  return r;
}
const RD=[
{g:'liq',id:'current',f:'x',d:'hi',good:1.5,ok:1},{g:'liq',id:'quick',f:'x',d:'hi',good:1,ok:.7},{g:'liq',id:'cash',f:'x',d:'hi',good:.5,ok:.2},{g:'liq',id:'wc',f:'m',d:'pos'},
{g:'prof',id:'gm',f:'p',d:'hi',good:.3,ok:.15},{g:'prof',id:'om',f:'p',d:'hi',good:.15,ok:.05},{g:'prof',id:'ebitdam',f:'p',d:'hi',good:.2,ok:.1},{g:'prof',id:'nm',f:'p',d:'hi',good:.1,ok:.03},{g:'prof',id:'roa',f:'p',d:'hi',good:.05,ok:.02},{g:'prof',id:'roe',f:'p',d:'hi',good:.15,ok:.08},
{g:'lev',id:'de',f:'x',d:'lo',good:1,ok:2},{g:'lev',id:'dr',f:'p',d:'lo',good:.5,ok:.7},{g:'lev',id:'em',f:'x',d:'lo',good:2.5,ok:4},{g:'lev',id:'icr',f:'x',d:'hi',good:4,ok:1.5},
{g:'eff',id:'at',f:'x',d:'hi',good:1,ok:.5},{g:'eff',id:'invt',f:'x',d:'hi',good:6,ok:3},{g:'eff',id:'dio',f:'d',d:'lo',good:60,ok:120},{g:'eff',id:'dso',f:'d',d:'lo',good:45,ok:90},{g:'eff',id:'dpo',f:'d',d:'n'},{g:'eff',id:'ccc',f:'d',d:'lo',good:60,ok:120},
{g:'gro',id:'revg',f:'p',d:'hi',good:.1,ok:0},{g:'gro',id:'nig',f:'p',d:'hi',good:.1,ok:0}
];
const GW={liq:.2,prof:.3,lev:.25,eff:.15,gro:.1},SCV={good:100,fair:60,weak:20};
const ICON={good:'✓',fair:'!',weak:'✕'},SL={good:'h_strong',fair:'h_fair',weak:'h_weak'};
function status(d,v){
  if(v==null||!isFinite(v)||d.d==='n')return null;
  if(d.d==='pos')return v>0?'good':'weak';
  if(d.d==='hi')return v>=d.good?'good':v>=d.ok?'fair':'weak';
  return v<=d.good?'good':v<=d.ok?'fair':'weak';
}
function fmtRp(d,v){
  if(v==null||!isFinite(v))return '—';
  if(d.f==='x')return fmtN(v,2)+'×';
  if(d.f==='p')return fmtN(v*100,1)+'%';
  if(d.f==='d')return fmtN(v,0)+'\u00A0'+t('u_days',null,true);
  return moneyS(v);
}
function rcard(d,v,s,pv){
  const meta=[];
  if(d.d==='pos')meta.push(t('bench')+': '+N('&gt; 0'));
  else if(d.d!=='n')meta.push(t('bench')+': '+N(esc((d.d==='hi'?'≥ ':'≤ ')+fmtRp(d,d.good))));
  if(pv!=null&&d.g!=='gro')meta.push(t('prev')+': '+N(esc(fmtRp(d,pv))));
  return '<div class="rcard '+(s||'')+'"><div class="rname">'+t('r_'+d.id)+'</div><div class="rval">'+N(esc(fmtRp(d,v)))+(s?'<span class="badge '+s+'"><span aria-hidden="true">'+ICON[s]+'</span>'+t(SL[s])+'</span>':'')+'</div><div class="rmeta">'+meta.map(m=>'<span>'+m+'</span>').join('')+'</div></div>';
}
function insights(cs,ps,r,r0){
  const L=[],B=cs.B,I=cs.IS,x2=v=>iso(fmtN(v,2)+'×');
  const m=Math.max(Math.abs(B.ta),Math.abs(B.tle));
  if(m>0&&Math.abs(B.diff)>m*0.005)L.push(['risk','i_bal',{diff:iso(moneyS(Math.abs(B.diff)))}]);
  if(I.ni<0)L.push(['risk','i_loss',{ni:iso(moneyS(Math.abs(I.ni)))}]);
  else if(r.nm!=null&&r.nm>=.1)L.push(['good','i_nm',{v:iso(pctS(r.nm))}]);
  if(r.current!=null){if(r.current<1)L.push(['risk','i_cr_low',{v:x2(r.current)}]);else if(r.current>=1.5)L.push(['good','i_cr_good',{v:x2(r.current)}]);}
  if(B.eq<0)L.push(['risk','i_eq_neg',{}]);
  else if(r.de!=null){if(r.de>2)L.push(['risk','i_lev_hi',{v:x2(r.de)}]);else if(r.de<=1)L.push(['good','i_lev_lo',{v:x2(r.de)}]);}
  if(r.icr!=null){if(r.icr<1.5)L.push(['risk','i_icr_low',{v:x2(r.icr)}]);else if(r.icr>=4)L.push(['good','i_icr_good',{v:x2(r.icr)}]);}
  if(ps.has){
    if(r.revg!=null){if(r.revg>=0)L.push(['good','i_rev_up',{v:iso(pctS(r.revg))}]);else L.push(['risk','i_rev_dn',{v:iso(pctS(Math.abs(r.revg)))}]);}
    if(r0&&r.nm!=null&&r0.nm!=null&&Math.abs(r.nm-r0.nm)>=.02)L.push([r.nm>r0.nm?'good':'risk',r.nm>r0.nm?'i_nm_up':'i_nm_dn',{a:iso(pctS(r0.nm)),b:iso(pctS(r.nm))}]);
  }
  if(r.dso!=null&&r.dso>90)L.push(['risk','i_dso',{v:iso(fmtN(r.dso,0))}]);
  if(r.ccc!=null&&r.ccc>120)L.push(['risk','i_ccc',{v:iso(fmtN(r.ccc,0))}]);
  if(r.roe!=null&&r.roe>=.15&&r.em!=null&&r.em>3)L.push(['info','i_roe_lev',{roe:iso(pctS(r.roe)),em:x2(r.em)}]);
  return L;
}
function hv(ids,pfx,grp,base,baseLbl,cs,ps){
  const rows=ids.map(id=>{
    const c=cs[grp][id],p=ps[grp][id],chg=ps.has&&p!==0?(c-p)/Math.abs(p):null,bs=cs[grp][base],share=bs?c/bs:null;
    return '<tr><th scope="row">'+t(pfx+'_'+id)+'</th><td>'+money(c)+'</td><td>'+(ps.has?money(p):'')+'</td><td>'+(chg==null?'':pct(chg))+'</td><td>'+(share==null?'':pct(share))+'</td></tr>';
  }).join('');
  return '<div class="tbl"><table class="hv"><thead><tr><th>'+t('c_item')+'</th><th>'+t('fin_curp')+'</th><th>'+t('fin_prevp')+'</th><th>'+t('c_chg')+'</th><th>'+t(baseLbl)+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function updateCalc(cs,ps){
  $$('td[data-calc]').forEach(td=>{
    const S=td.dataset.p==='cur'?cs:ps,id=td.dataset.calc,val=(id in S.IS)?S.IS[id]:S.B[id];
    td.innerHTML=S.has?money(val):'';
  });
  const dr=$('tr.r-diff');if(dr)dr.classList.toggle('bad',cs.has&&unbalanced(cs));
  const bb=$('#balBadge');
  if(!cs.has){bb.textContent='';bb.className='bal';}
  else if(unbalanced(cs)){bb.textContent='✕ '+t('bs_bad',null,true);bb.className='bal bad';}
  else{bb.textContent='✓ '+t('bs_ok',null,true);bb.className='bal ok';}
}
function renderFin(){
  const cs=getStm('cur'),ps=getStm('prev');
  updateCalc(cs,ps);
  const box=$('#finResult');
  if(!cs.has){box.innerHTML='<div class="sheet empty">'+t('fin_empty')+'</div>';return;}
  const r=ratios(cs,ps.has?ps:null),r0=ps.has?ratios(ps,null):null;
  let sum=0,wsum=0;const gh=[];
  ['liq','prof','lev','eff','gro'].filter(g=>g!=='gro'||ps.has).forEach(g=>{
    const sc=[];let cards='';
    RD.filter(d=>d.g===g).forEach(d=>{
      const v=r[d.id],s=status(d,v);
      if(s)sc.push(SCV[s]);
      if(g==='gro'&&v==null)return;
      cards+=rcard(d,v,s,r0?r0[d.id]:null);
    });
    const gs=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null;
    if(gs!=null){sum+=GW[g]*gs;wsum+=GW[g];}
    if(cards)gh.push('<div class="rgroup"><h4><span>'+t('rc_'+g)+'</span></h4><div class="rgrid">'+cards+'</div></div>');
  });
  const score=wsum?Math.round(sum/wsum):null;
  const cls=score>=75?'good':score>=55?'warn':'bad',hk=score>=75?'h_strong':score>=55?'h_fair':'h_weak';
  const ins=insights(cs,ps,r,r0);
  const icons={good:'✓',risk:'!',info:'i'};
  const insH=ins.length?'<ul class="ins">'+ins.map(x=>'<li class="'+x[0]+'"><span class="ic" aria-hidden="true">'+icons[x[0]]+'</span><div>'+t(x[1],x[2])+'</div></li>').join('')+'</ul>':'';
  let dup='';
  if([r.nm,r.at,r.em,r.roe].every(v=>v!=null)){
    dup='<h3 style="margin-top:22px">'+t('dp_t')+'</h3><div class="dupont"><div><small>'+t('r_nm')+'</small>'+pct(r.nm)+'</div><span>×</span><div><small>'+t('r_at')+'</small>'+N(fmtN(r.at,2)+'×')+'</div><span>×</span><div><small>'+t('r_em')+'</small>'+N(fmtN(r.em,2)+'×')+'</div><span>=</span><div class="eq"><small>'+t('r_roe')+'</small>'+pct(r.roe)+'</div></div><p class="note">'+t('dp_n')+'</p>';
  }
  let cost='';
  if(cs.IS.rev>0){
    const I=cs.IS,segs=[['cogs',I.cogs],['opex',I.opex],['da',I.da],['int',I.int],['tax',I.tax],['ni',Math.max(I.ni,0)]].filter(s=>s[1]>0);
    const tot=segs.reduce((a,s)=>a+s[1],0);
    if(tot>0)cost='<h3 style="margin-top:22px">'+t('cs_t')+'</h3><div class="cbar" role="img" aria-label="'+t('cs_t',null,true)+'">'+segs.map(s=>'<i class="k-'+s[0]+'" style="width:'+(s[1]/tot*100).toFixed(2)+'%"></i>').join('')+'</div><div class="legend">'+segs.map(s=>'<span><em class="k-'+s[0]+'"></em>'+t('is_'+s[0])+' '+pct(s[1]/I.rev)+'</span>').join('')+'</div>';
  }
  const hvH='<details class="sheet"><summary>'+t('hv_t')+'</summary><h4>'+t('fin_is')+'</h4>'+hv(['rev','cogs','gp','opex','da','ebit','int','oth','ebt','tax','ni'],'is','IS','rev','c_pr',cs,ps)+'<h4>'+t('fin_bs')+'</h4>'+hv(['cash','ar','inv','tca','ppe','ona','ta','ap','std','tcl','ltd','tl','eq'],'bs','B','ta','c_pa',cs,ps)+'</details>';
  box.innerHTML='<div class="sheet"><div class="rtop"><div><h2>'+t('fin_score')+'</h2>'+(score!=null?gauge(score,cls)+'<div class="grade">'+t(hk)+'</div>':'')+'</div><div>'+(insH?'<h3>'+t('ins_t')+'</h3>'+insH:'')+'</div></div></div>'
    +'<div class="sheet"><h2>'+t('fin_res')+'</h2>'+gh.join('')+dup+cost+'</div>'
    +hvH+'<p class="note">'+t('fin_note')+'</p>';
}

const FIN_RULES=[
 {id:'cogs',g:'is',r:[/cost of goods sold/,/cost of sales/,/cost of revenue/,/\bcogs\b/]},
 {id:'da',g:'is',r:[/depreciation.*amorti[sz]ation/,/amorti[sz]ation.*depreciation/,/\bd\s?&\s?a\b/,/\bdepreciation\b/,/\bamorti[sz]ation\b/]},
 {id:'opex',g:'is',r:[/operating expenses?/,/selling,? general.*administrative/,/\bsg\s?&\s?a\b/,/administrative expenses?/,/operating costs?/]},
 {id:'int',g:'is',r:[/interest expense/,/finance costs?/,/interest paid/,/\binterest\b/]},
 {id:'tax',g:'is',r:[/income tax expense/,/tax expense/,/income tax/,/\btaxation\b/]},
 {id:'oth',g:'is',r:[/other income/,/other expenses?/,/non[\s-]?operating/]},
 {id:'rev',g:'is',r:[/total revenue/,/net revenue/,/net sales/,/sales revenue/,/^revenue$/,/\brevenue\b/,/\bturnover\b/,/^sales$/,/\bsales\b/]},
 {id:'cash',g:'bs',r:[/cash and cash equivalents/,/cash\s?&\s?equivalents/,/^cash$/,/\bcash\b/]},
 {id:'ar',g:'bs',r:[/accounts? receivables?/,/trade receivables?/,/\breceivables?\b/,/\bdebtors\b/]},
 {id:'inv',g:'bs',r:[/\binventor(?:y|ies)\b/,/\bstock\b/]},
 {id:'ppe',g:'bs',r:[/property,? plant.*equipment/,/fixed assets?/,/\bppe\b/]},
 {id:'ap',g:'bs',r:[/accounts? payables?/,/trade payables?/,/\bpayables?\b/,/\bcreditors\b/]},
 {id:'std',g:'bs',r:[/short[\s-]?term (?:debt|borrowings?|loans?)/,/current portion of long[\s-]?term debt/,/bank overdraft/]},
 {id:'ltd',g:'bs',r:[/long[\s-]?term (?:debt|borrowings?|loans?)/]},
 {id:'eq',g:'bs',r:[/total (?:shareholders'?|stockholders'?|owners'?) equity/,/shareholders'? equity/,/stockholders'? equity/,/owners'? equity/,/\bequity\b/]},
 {id:'oca',g:'bs',r:[/other current assets?/,/prepaid expenses?/]},
 {id:'ona',g:'bs',r:[/other non[\s-]?current assets?/,/intangible assets?/,/other assets?/]},
 {id:'ocl',g:'bs',r:[/other current liabilities/,/accrued (?:liabilities|expenses)/]},
 {id:'oncl',g:'bs',r:[/other non[\s-]?current liabilities/,/deferred tax liabilit/]}
];
const FIN_EXCLUDE=[/total assets/,/total current assets/,/total non[\s-]?current assets/,/total liabilities and equity/,/total liabilities/,/total current liabilities/,/total non[\s-]?current liabilities/,/gross profit/,/operating income/,/\bebit\b/,/\bebitda\b/,/net income/,/net profit/,/profit before tax/,/profit after tax/,/earnings before/,/total expenses?/,/working capital/];
const normLabel=s=>String(s).toLowerCase().replace(/[_]+/g,' ').replace(/[^a-z0-9&%' \-]/g,' ').replace(/\s+/g,' ').trim();
function matchRule(norm){
  for(const rule of FIN_RULES){if(rule.r.some(re=>re.test(norm)))return rule;}
  return null;
}
function splitCsv(line){return line.split(',').map(c=>c.replace(/^\s*"|"\s*$/g,'').trim());}
function cellsToLV(cells){
  cells=cells.filter(c=>c!=null&&String(c)!=='');
  if(cells.length<2)return null;
  const label=String(cells[0]).trim();
  let val=null;
  for(let i=cells.length-1;i>=1;i--){const v=(typeof cells[i]==='number')?cells[i]:parseNum(cells[i]);if(v!=null){val=v;break;}}
  if(!label||val==null)return null;
  return[label,val];
}
function parseLineLV(line){
  const m=line.trim().match(/^(.*?)[\s,:\t]+([+\-]?\(?\s*\d[\d,.]*\s*\)?%?)\s*$/);
  if(!m)return null;
  const label=m[1].replace(/["']/g,'').trim(),val=parseNum(m[2]);
  return(label&&val!=null)?[label,val]:null;
}
function rowsFromText(text,ext){
  return text.split(/\r?\n/).map(line=>{
    if(!line.trim())return null;
    const cells=ext==='csv'?splitCsv(line):line.split(/\t+|\s{2,}/).map(s=>s.trim()).filter(Boolean);
    return cellsToLV(cells)||parseLineLV(line);
  }).filter(Boolean);
}
function setFinMsg(text,ok){const m=$('#finMsg');m.textContent=text;m.className='msg'+(ok?' info':'');}
function applyFinRows(rows,period){
  if(!rows.length){setFinMsg(t('err_fin_empty',null,true));return;}
  const filled=new Set(),matched=[];let unmatched=0;
  rows.forEach(([label,val])=>{
    const norm=normLabel(label);
    if(!norm||FIN_EXCLUDE.some(re=>re.test(norm)))return;
    const rule=matchRule(norm);
    if(rule&&!filled.has(rule.id)){
      state.fin[period][rule.id]=val;filled.add(rule.id);
      matched.push(t(rule.g+'_'+rule.id,null,true));
    }else if(!rule){unmatched++;}
  });
  refreshInputs();renderFin();
  const parts=[];
  if(matched.length)parts.push(t('fin_matched',{n:matched.length},true)+' '+matched.join(', '));
  if(unmatched)parts.push(t('fin_unmatched',{n:unmatched},true));
  setFinMsg(parts.length?parts.join(' — '):t('err_fin_empty',null,true),matched.length>0);
}
async function handleFinFile(f){
  const ext=f.name.split('.').pop().toLowerCase();
  const period=$('#finPeriodSel').value==='prev'?'prev':'cur';
  try{
    let rows;
    if(ext==='xlsx'){
      if(!window.XLSX)throw new Error('noxlsx');
      const buf=await f.arrayBuffer();
      const wb=window.XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=window.XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      rows=aoa.map(r=>cellsToLV(r)).filter(Boolean);
    }else{
      rows=rowsFromText(await f.text(),ext==='csv'?'csv':'txt');
    }
    applyFinRows(rows,period);
  }catch(err){
    setFinMsg(err&&err.message==='noxlsx'?t('err_fin_xlsx',null,true):t('err_fin_file',null,true));
  }
}
window.__T.finUpload={handleFinFile,rowsFromText,matchRule,normLabel,applyFinRows};

/* ---------------- currency ---------------- */
function curName(code){try{return new Intl.DisplayNames([state.lang],{type:'currency'}).of(code);}catch(e){return code;}}
function buildCurSel(){
  $('#curSel').innerHTML=Object.keys(CURS).map(c=>'<option value="'+c+'"'+(c===state.cur?' selected':'')+'>'+c+' ('+esc(CURS[c].sym)+') '+esc(curName(c))+'</option>').join('');
}
function updateCurNote(){$('#finCurNote').textContent=t('fin_in',{c:state.cur+' ('+CURS[state.cur].sym+')'},true);}
function buildRates(){
  $('#ratesGrid').innerHTML=Object.keys(CURS).filter(c=>c!=='USD').map(c=>'<label class="rate"><span class="num">1 USD =</span><input type="text" inputmode="decimal" data-rate="'+c+'" value="'+state.rates[c]+'"><span class="num">'+c+'</span></label>').join('');
}
function setRate(code,v){
  if(code===state.cur){
    const f=state.rates[code]/v;
    ['cur','prev'].forEach(p=>{for(const id in state.fin[p]){if(state.fin[p][id]!=null)state.fin[p][id]*=f;}});
  }
  state.rates[code]=v;savePrefs();refreshInputs();renderFin();
}

/* ---------------- UI wiring ---------------- */
function buildLangSeg(){
  const g=$('#langSeg');g.setAttribute('aria-label',t('lang',null,true));
  g.innerHTML=Object.keys(LANGS).map(k=>'<button type="button" data-lang="'+k+'" lang="'+k+'" aria-pressed="'+(state.lang===k)+'">'+LANGS[k].n+'</button>').join('');
}
const TYPES=[['cv','type_cv'],['asg','type_asg'],['rep','type_rep'],['thesis','type_thesis']];
function buildTypeSeg(){
  $('#typeSeg').innerHTML=TYPES.map(([id,k])=>'<button type="button" role="radio" aria-checked="'+(state.dtype===id)+'" data-type="'+id+'">'+t(k)+'</button>').join('');
}
function syncType(){
  $('#fTarget').hidden=state.dtype==='cv';
  const kl=$('#kwLabel');kl.dataset.i18n=state.dtype==='cv'?'doc_kw_cv':'doc_kw';kl.textContent=t(kl.dataset.i18n,null,true);
}
function setMsg(key,info){
  const m=$('#docMsg');m.className='msg'+(info?' info':'');
  if(key){m.dataset.i18n=key;m.textContent=t(key,null,true);}else{delete m.dataset.i18n;m.textContent='';}
}
function setTab(tab){
  state.tab=tab;
  $$('.door').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('#panel-docs').hidden=tab!=='docs';$('#panel-fin').hidden=tab!=='fin';
}
function applyLang(){
  const h=document.documentElement;h.lang=state.lang;h.dir=LANGS[state.lang].dir;
  document.title=t('app_name',null,true)+': '+t('tab_docs',null,true)+' / '+t('tab_fin',null,true);
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n,null,true);});
  $('#aboutLink').textContent=t('nav_about',null,true);
  $('#termsLink').textContent=t('nav_terms',null,true);
  $$('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh,null,true);});
  buildLangSeg();buildCurSel();buildTypeSeg();labelInputs();updateCurNote();renderDoc();renderFin();
}
function runAnalyze(){
  const text=$('#docText').value;
  if(!text.trim()){setMsg('err_empty');state.doc=null;renderDoc();return;}
  setMsg(null);
  const kws=$('#kwIn').value.split(/[,;\n،]/).map(s=>s.trim()).filter(Boolean);
  const target=parseInt($('#targetWords').value,10)||0;
  state.doc=analyze(text,state.dtype,{kws,target});
  renderDoc();
  $('#docResult').scrollIntoView();
}
const SAMPLE_KW={cv:'Power BI, SQL, inventory, forecasting, Python',asg:'social media, academic performance, distraction',rep:'adoption, trust, retailers',thesis:'adoption, trust, retailers'};
function fallbackCopy(s){
  try{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
}
function copyText(s){
  return new Promise(res=>{
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>res(true),()=>res(fallbackCopy(s)));return;}}catch(e){}
    res(fallbackCopy(s));
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){state.lang=b.dataset.lang;savePrefs();applyLang();return;}
  if(b.dataset.tab){setTab(b.dataset.tab);return;}
  if(b.dataset.type){state.dtype=b.dataset.type;buildTypeSeg();syncType();return;}
  if(b.id==='btnAnalyze'){runAnalyze();return;}
  if(b.id==='btnSample'){
    $('#docText').value=SAMPLES[state.dtype];$('#kwIn').value=SAMPLE_KW[state.dtype];$('#targetWords').value='';
    runAnalyze();setMsg('sample_note',true);return;
  }
  if(b.id==='btnClear'){$('#docText').value='';$('#kwIn').value='';$('#targetWords').value='';state.doc=null;renderDoc();setMsg(null);return;}
  if(b.id==='btnCopy'){
    copyText(docSummary()).then(ok=>{
      if(ok){const o=b.textContent;b.textContent=t('copied',null,true);setTimeout(()=>{b.textContent=t('btn_copy',null,true);},1600);}
      else{setMsg('copyfail');}
    });return;
  }
  if(b.id==='finSample'){
    ['cur','prev'].forEach(p=>{state.fin[p]={};for(const id in SAMPLE_FIN[p])state.fin[p][id]=SAMPLE_FIN[p][id]/state.rates.PKR;});
    refreshInputs();renderFin();return;
  }
  if(b.id==='finClear'){state.fin={cur:{},prev:{}};refreshInputs();renderFin();return;}
});
$('#curSel').addEventListener('change',e=>{state.cur=e.target.value;savePrefs();refreshInputs();updateCurNote();renderFin();});
$('#panel-fin').addEventListener('input',e=>{
  const el=e.target;if(!el.classList.contains('amt'))return;
  const v=parseNum(el.value);
  state.fin[el.dataset.p][el.dataset.id]=v==null?null:v/rate();
  renderFin();
});
$('#panel-fin').addEventListener('focusin',e=>{
  const el=e.target;if(!el.classList.contains('amt'))return;
  const c=state.fin[el.dataset.p][el.dataset.id];
  if(c!=null)el.value=String(Math.round(c*rate()*100)/100);
});
$('#panel-fin').addEventListener('focusout',e=>{
  const el=e.target;if(el.classList.contains('amt')){
    const c=state.fin[el.dataset.p][el.dataset.id];el.value=c==null?'':fmtInp(c*rate());
  }
});
$('#panel-fin').addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.rate)return;
  const v=parseNum(el.value);
  if(v>0)setRate(el.dataset.rate,v);else el.value=state.rates[el.dataset.rate];
});
$('#finFileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  setFinMsg('',true);
  await handleFinFile(f);
  e.target.value='';
});
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const ext=f.name.split('.').pop().toLowerCase();
  try{
    if(ext==='docx'){
      if(!window.mammoth)throw new Error('nodocx');
      const buf=await f.arrayBuffer();
      const r=await window.mammoth.extractRawText({arrayBuffer:buf});
      $('#docText').value=r.value;
    }else{$('#docText').value=await f.text();}
    setMsg(null);
  }catch(err){setMsg(err.message==='nodocx'?'err_docx':'err_file');}
  e.target.value='';
});

/* init */
loadPrefs();
buildTable($('#tblIS'),IS_ROWS,'is');
buildTable($('#tblBS'),BS_ROWS,'bs');
buildRates();
syncType();
setTab('docs');
applyLang();
})();
</script>
</body>
</html>
